services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classsathi-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/classsathi
      - JWT_SECRET=classsathi_super_secret_docker_key_2026
      - SCHOOL_TIMEZONE=Asia/Kolkata
      - CORS_ORIGIN=http://localhost:5000
    depends_on:
      - mongo

  mongo:
    image: mongo:7-jammy
    container_name: classsathi-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
